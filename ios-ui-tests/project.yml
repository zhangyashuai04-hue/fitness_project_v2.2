name: FitnessUIProbe
options:
  bundleIdPrefix: com.example.fitnessuitest
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  ProbeHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fitnessuitest.host
  FitnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ProbeHost
schemes:
  FitnessUIProbe:
    build:
      targets:
        ProbeHost: all
        FitnessUITests: [test]
    test:
      targets: [FitnessUITests]
